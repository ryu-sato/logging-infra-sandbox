# Minimal single-binary Loki for the devcontainer sandbox (no object storage, no HA).
# Chart: grafana/loki (https://github.com/grafana/loki/tree/main/production/helm/loki)
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  useTestSchema: true
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  limits_config:
    retention_period: 24h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    # Binds to the static hostPath PV in loki-pv.yaml instead of kind's default
    # local-path provisioner, so data survives kind cluster recreation.
    storageClass: loki-local-storage

# Explicitly zero out the simple-scalable targets; the chart's validate.yaml
# rejects nonzero replicas on both singleBinary and read/write/backend at once.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Skip components not needed for a single-binary sandbox
gateway:
  enabled: false
minio:
  enabled: false
test:
  enabled: false
lokiCanary:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
