# Grafana pre-wired with the in-cluster Loki datasource.
# Chart: grafana/grafana (https://github.com/grafana-community/helm-charts/tree/main/charts/grafana)
adminUser: admin
adminPassword: admin

persistence:
  enabled: false

service:
  type: ClusterIP
  port: 80

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        isDefault: true
